[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "verification-evidence"
version = "0.1.0"
description = "Simulator-independent verification evidence and obligation assessment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
simulation = ["cocotb>=1.9", "pyuvm>=4", "pyvsc>=0.9.6"]

[project.scripts]
vevidence = "verification_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verification_evidence = ["templates/ready_valid/*.py", "templates/ready_valid/*.md", "templates/ready_valid/rtl/*.sv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
